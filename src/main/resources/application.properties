spring.application.name=assistenteEmpresarial

spring.datasource.url=jdbc:postgresql://localhost:5433/assistenteEmpresarial
spring.datasource.username=postgres
spring.datasource.password=221076
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

spring.docker.compose.enabled=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=seu-email@gmail.com
spring.mail.password=sua-senha-de-app
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

api.security.token.secret=${JWT_SECRET:minha-chave-secreta-muito-segura-123}

mercadopago.access-token=APP_USR-seu-token-de-acesso-aqui

spring.jackson.time-zone=America/Sao_Paulo

# Configurações de Upload de Documentos
app.upload.dir=./uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===================================================================
# Configurações de Modelos de Linguagem (LLM) - Chat
# ===================================================================
# Provedor ativo de LLM: OPENAI, GEMINI ou OLLAMA
app.llm.provider=${LLM_PROVIDER:OPENAI}

# 1. OpenAI (GPT-4o-mini)
openai.api-key=${OPENAI_API_KEY:}
openai.chat-model=${OPENAI_CHAT_MODEL:gpt-6.1-luna}
##openai.chat-model= gpt-4o-mini
openai.temperature=${OPENAI_TEMPERATURE:0.3}
openai.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:60}

# 2. Google Gemini (Gemini Flash)
gemini.api-key=${GEMINI_API_KEY:}
gemini.chat-model=${GEMINI_CHAT_MODEL:gemini-1.5-flash}
gemini.temperature=${GEMINI_TEMPERATURE:0.3}
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:60}

# 3. Ollama (Local)
ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
ollama.chat-model=${OLLAMA_CHAT_MODEL:llama3.2}
ollama.temperature=${OLLAMA_TEMPERATURE:0.3}
ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:120}
ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
ollama.embedding-dimension=768


