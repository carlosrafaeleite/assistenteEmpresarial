spring.application.name=assistenteEmpresarial

spring.datasource.url=jdbc:postgresql://localhost:5435/assistenteEmpresarial
spring.datasource.username=postgres
spring.datasource.password=221076
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

spring.docker.compose.enabled=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=seu-email@gmail.com
spring.mail.password=sua-senha-de-app
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

api.security.token.secret=${JWT_SECRET:minha-chave-secreta-muito-segura-123}

mercadopago.access-token=APP_USR-seu-token-de-acesso-aqui

spring.jackson.time-zone=America/Sao_Paulo

# ===================================================================
# Configurações de Upload de Documentos, Planos e Fila Assíncrona (RabbitMQ)
# ===================================================================
app.upload.dir=./uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.rabbitmq.enabled=${RABBITMQ_ENABLED:false}
app.upload.async=${UPLOAD_ASYNC:false}

# ===================================================================
# Limites de Segurança do Chat e Rate Limiting do Widget Público
# ===================================================================
app.chat.max-question-chars=${CHAT_MAX_QUESTION_CHARS:500}
app.chat.max-questions-per-minute=${CHAT_MAX_QUESTIONS_PER_MINUTE:10}
app.widget.max-requests-per-minute=${WIDGET_MAX_REQUESTS_PER_MINUTE:60}

# ===================================================================
# Arquitetura Híbrida de IA (Ingestão/Busca Ollama + Chat Gemini)
# ===================================================================
# Provedor ativo de LLM para geração de respostas no Chat: GEMINI, OPENAI ou OLLAMA
app.llm.provider=${LLM_PROVIDER:GEMINI}

# 1. Google Gemini (Geração de Resposta no Chat)
gemini.api-key=${GEMINI_API_KEY:}
gemini.chat-model=${GEMINI_CHAT_MODEL:gemini-1.5-flash}
gemini.temperature=${GEMINI_TEMPERATURE:0.3}
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:60}

# 2. Ollama Local (Custo Zero para Embeddings de Ingestão e Busca Vetorial 768d)
ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
ollama.chat-model=${OLLAMA_CHAT_MODEL:llama3.2}
ollama.temperature=${OLLAMA_TEMPERATURE:0.3}
ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:120}
ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
ollama.embedding-dimension=768

# 3. OpenAI (Provedor Alternativo/Fallback de Chat)
openai.api-key=${OPENAI_API_KEY:}
openai.chat-model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
openai.temperature=${OPENAI_TEMPERATURE:0.3}
openai.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:60}

# ===================================================================
# Painel Administrativo Master do Dono do SaaS
# ===================================================================
app.saas-owner.email=${SAAS_OWNER_EMAIL:gerenteaifast@gmail.com}
app.saas-owner.empresa=${SAAS_OWNER_EMPRESA:MandesTech}
